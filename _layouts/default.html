<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
{% assign page_name = page.layout | default: 'default' %}
{% if page.url == '/' or page.url == '/index.html' %}
    {% assign page_name = 'home' %}
{% endif %}
<body class="page-{{ page_name }}">
    <header class="site-header">
        <div class="site-shell site-header-inner">
            <div class="site-branding">
                <p class="site-eyebrow">Tech Blog</p>
                <h1 class="site-title">
                    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
                </h1>
                {% if site.description %}
                    <p class="site-description">{{ site.description }}</p>
                {% endif %}
            </div>

            <nav class="site-nav" aria-label="Primary">
                <a class="site-nav-link" href="{{ '/' | relative_url }}">Home</a>
                <a class="site-nav-link" href="{{ '/tags' | relative_url }}">Tags</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <section class="site-shell main-content">
            {{ content }}
        </section>
    </main>
</body>
</html>
